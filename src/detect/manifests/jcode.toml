id = "jcode"
version = "2026.10.21.2"
min_engine_version = 1
updated_at = "2026-10-21T00:00:00Z"
aliases = ["herdr:jcode"]

# Jcode reports identity only. Prefer live processing/attention chrome over prompts.
# Sources: jcode-tui ui_input/ui_prepare/ui_inline_interactive and
# jcode-tui-permissions PermissionsApp::draw; › is the rendered user prompt.
[[rules]]
id = "pending_permission"
state = "blocked"
priority = 1000
region = "whole_recent"
visible_blocker = true
all = [
  { line_regex = ['^[╭┌─ ]*Permissions \([1-9][0-9]* pending\)[─╮┐ ]*$'] },
  { any = [{ contains = ["Agent is waiting for this decision"] }, { line_regex = ['(?:^|│)\s*a\s+approve\s+d\s+deny\s'] }, { contains = ["confirm deny", "Esc"] }] },
]

[[rules]]
id = "interactive_selection"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(12)"
visible_blocker = true
any = [
  { contains = ["↑↓ choose · Enter select · Esc cancel"] },
  { contains = ["↑↓ route · ←→ column · Enter select · Esc cancel"] },
]

[[rules]]
id = "processing_composer"
state = "working"
priority = 800
region = "bottom_non_empty_lines(14)"
visible_working = true
line_regex = ['^\s*[0-9]+…(?:\s|$)']

[[rules]]
id = "activity_status"
state = "working"
priority = 750
region = "bottom_non_empty_lines(14)"
visible_working = true
any = [
  { line_regex = ['^\s*[^\s]+\s+(?:sending|thinking|connecting|sending context|waiting for response|streaming|authenticating|retrying [0-9]+/[0-9]+)…?\s'] },
  { line_regex = ['^\s*[^\s]+\s+running \S'] },
  { line_regex = ['^\s*[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]\s+(?:(?:\(stalled [0-9]+s\)|\(no tokens [0-9]+s\)) · )?[0-9]+(?:\.[0-9]+)?s(?:\s|$)'] },
  { contains = ["network disconnected, waiting to retry ·"] },
  { contains = ["Rate limited. Auto-retry in"] },
]

[[rules]]
id = "idle_composer"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_idle = true
line_regex = ['^\s*[0-9]+[>›»$](?:\s|$)']
